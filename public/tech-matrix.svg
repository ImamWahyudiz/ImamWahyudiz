      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&amp;family=Orbitron:wght@700;900&amp;display=swap');

      text {
        font-family: 'JetBrains Mono', monospace;
      }
      .font-orbitron {
        font-family: 'Orbitron', 'JetBrains Mono', sans-serif;
      }

      .card-glow {
