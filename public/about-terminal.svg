<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 540 620" width="540" height="620">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap');
      
      text {
        font-family: 'JetBrains Mono', monospace;
        fill: #f1f5f9;
      }

      .window-glow {
        filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.25));
      }

      .kw { fill: #c084fc; font-weight: 700; }
      .cls { fill: #38bdf8; font-weight: 700; }
      .prop { fill: #00f2fe; font-weight: 600; }
      .str { fill: #86efac; }
      .arr { fill: #fde047; }
      .num { fill: #64748b; font-size: 11px; font-weight: 600; }
      .cmt { fill: #94a3b8; font-style: italic; }
      .func { fill: #60a5fa; font-weight: 700; }
      .op { fill: #f8fafc; font-weight: 600; }
    </style>

    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Main Window Frame (Height 620 to match Lanyard SVG) -->
  <rect x="2" y="2" width="536" height="616" rx="16" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5" class="window-glow" />

  <!-- Top macOS Title Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 524 2 Q 538 2 538 16 L 538 42 L 2 42 Z" fill="#0b1329" />
  <line x1="2" y1="42" x2="538" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Window Action Buttons -->
  <circle cx="22" cy="22" r="6" fill="#ef4444" />
  <circle cx="42" cy="22" r="6" fill="#eab308" />
  <circle cx="62" cy="22" r="6" fill="#22c55e" />

  <!-- File Tab & Python Real Icon -->
  <g transform="translate(100, 11)">
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    
    <!-- Real Python SVG Icon Glyph -->
    <g transform="translate(8, 4) scale(0.65)">
      <path d="M9.9 0C4.5 0 4.8 2.3 4.8 2.3l.01 2.4h5.2V5.5H3.1S0 5.1 0 10.4c0 5.4 2.7 5.2 2.7 5.2h1.6V13.3s-.1-2.7 2.7-2.7h5.1s2.6.1 2.6-2.5V2.6S15.3 0 9.9 0zm-2.7 1.6c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9z" fill="#38bdf8" />
      <path d="M10.1 20c5.4 0 5.1-2.3 5.1-2.3l-.01-2.4H10v-.8h6.9s3.1.4 3.1-4.9c0-5.4-2.7-5.2-2.7-5.2h-1.6v2.3s.1 2.7-2.7 2.7H7.9s-2.6-.1-2.6 2.5v4.8s-.6 2.6 4.8 2.6zm2.7-1.6c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9z" fill="#fde047" />
    </g>

    <text x="32" y="16" font-size="11" font-weight="600" fill="#f8fafc">developer.py</text>
  </g>

  <!-- System Status on right -->
  <rect x="425" y="12" width="100" height="20" rx="4" fill="#0369a1" opacity="0.3" stroke="#00f2fe" stroke-width="1" />
  <circle cx="438" cy="22" r="3.5" fill="#10b981" />
  <text x="480" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#00f2fe">LIVE // UTF-8</text>

  <!-- Code Body & Line Numbers -->
  <g transform="translate(15, 68)" font-size="11.5" line-height="1.55">
    
    <!-- Line numbers 01 to 20 -->
    <text x="10" y="16" class="num">01</text>
    <text x="10" y="38" class="num">02</text>
    <text x="10" y="60" class="num">03</text>
    <text x="10" y="82" class="num">04</text>
    <text x="10" y="104" class="num">05</text>
    <text x="10" y="126" class="num">06</text>
    <text x="10" y="148" class="num">07</text>
    <text x="10" y="170" class="num">08</text>
    <text x="10" y="192" class="num">09</text>
    <text x="10" y="214" class="num">10</text>
    <text x="10" y="236" class="num">11</text>
    <text x="10" y="258" class="num">12</text>
    <text x="10" y="280" class="num">13</text>
    <text x="10" y="302" class="num">14</text>
    <text x="10" y="324" class="num">15</text>
    <text x="10" y="346" class="num">16</text>
    <text x="10" y="368" class="num">17</text>
    <text x="10" y="390" class="num">18</text>
    <text x="10" y="412" class="num">19</text>
    <text x="10" y="434" class="num">20</text>

    <!-- Vertical separator line -->
    <line x1="32" y1="0" x2="32" y2="445" stroke="#1e293b" stroke-width="1" />

    <!-- Code Content -->
    <text x="45" y="16"><tspan class="cmt"># Architecting scalable web &amp; embedded systems</tspan></text>
    <text x="45" y="38"><tspan class="kw">class</tspan> <tspan class="cls">ImamWahyudi</tspan><tspan class="op">:</tspan></text>
    
    <text x="65" y="60"><tspan class="prop">name</tspan>       <tspan class="op">=</tspan> <tspan class="str">"Imam Wahyudi"</tspan></text>
    <text x="65" y="82"><tspan class="prop">username</tspan>   <tspan class="op">=</tspan> <tspan class="str">"ImamWahyudiz"</tspan></text>
    <text x="65" y="104"><tspan class="prop">role</tspan>       <tspan class="op">=</tspan> <tspan class="str">"Full Stack &amp; IoT Developer"</tspan></text>
    <text x="65" y="126"><tspan class="prop">location</tspan>   <tspan class="op">=</tspan> <tspan class="str">"Indonesia // Remote Worldwide"</tspan></text>
    
    <text x="65" y="148"><tspan class="prop">languages</tspan>  <tspan class="op">=</tspan> [<tspan class="arr">"JS"</tspan><tspan class="op">, </tspan><tspan class="arr">"Python"</tspan><tspan class="op">, </tspan><tspan class="arr">"C"</tspan><tspan class="op">, </tspan><tspan class="arr">"Java"</tspan><tspan class="op">, </tspan><tspan class="arr">"PHP"</tspan>]</text>
    <text x="65" y="170"><tspan class="prop">web_stack</tspan>  <tspan class="op">=</tspan> [<tspan class="arr">"Vue.js"</tspan><tspan class="op">, </tspan><tspan class="arr">"Node.js"</tspan><tspan class="op">, </tspan><tspan class="arr">"Tailwind"</tspan><tspan class="op">, </tspan><tspan class="arr">"Vite"</tspan>]</text>
    <text x="65" y="192"><tspan class="prop">hardware</tspan>   <tspan class="op">=</tspan> [<tspan class="arr">"ESP32"</tspan><tspan class="op">, </tspan><tspan class="arr">"KY-003 Hall"</tspan><tspan class="op">, </tspan><tspan class="arr">"KY-027"</tspan>]</text>
    <text x="65" y="214"><tspan class="prop">focus</tspan>      <tspan class="op">=</tspan> [<tspan class="str">"Client-Side OCR/PII"</tspan><tspan class="op">, </tspan><tspan class="str">"ML Drift"</tspan>]</text>
    
    <text x="45" y="246"><tspan class="kw">def</tspan> <tspan class="func">__init__</tspan><tspan class="op">(</tspan><tspan class="prop">self</tspan><tspan class="op">):</tspan></text>
    <text x="65" y="268"><tspan class="prop">self</tspan><tspan class="op">.</tspan><tspan class="prop">status</tspan> <tspan class="op">=</tspan> <tspan class="str">"Ready for new missions &amp; builds 🚀"</tspan></text>
    <text x="65" y="290"><tspan class="prop">self</tspan><tspan class="op">.</tspan><tspan class="prop">open_to_collab</tspan> <tspan class="op">=</tspan> <tspan class="kw">True</tspan></text>
    
    <text x="45" y="322"><tspan class="kw">def</tspan> <tspan class="func">get_philosophy</tspan><tspan class="op">(</tspan><tspan class="prop">self</tspan><tspan class="op">)</tspan> <tspan class="op">-&gt;</tspan> <tspan class="cls">str</tspan><tspan class="op">:</tspan></text>
    <text x="65" y="344"><tspan class="kw">return</tspan> <tspan class="str">"Build clean, scale robustly, learn continuously."</tspan></text>

    <text x="45" y="376"><tspan class="kw">def</tspan> <tspan class="func">connect</tspan><tspan class="op">(</tspan><tspan class="prop">self</tspan><tspan class="op">):</tspan></text>
    <text x="65" y="398"><tspan class="kw">return</tspan> <tspan class="op">{</tspan><tspan class="str">"github"</tspan><tspan class="op">: </tspan><tspan class="str">"ImamWahyudiz"</tspan><tspan class="op">, </tspan><tspan class="str">"status"</tspan><tspan class="op">: </tspan><tspan class="str">"200_OK"</tspan><tspan class="op">}</tspan></text>

    <text x="45" y="430"><tspan class="cls">dev</tspan> <tspan class="op">=</tspan> <tspan class="cls">ImamWahyudi</tspan><tspan class="op">()</tspan></text>
  </g>

  <!-- Interactive Terminal Output Drawer at Bottom -->
  <g transform="translate(16, 520)">
    <rect x="0" y="0" width="508" height="85" rx="8" fill="#040711" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3,3" />
    <text x="14" y="20" font-size="10.5" font-weight="700" fill="#00f2fe">&gt; python -m developer.run</text>
    <text x="14" y="38" font-size="10" fill="#86efac">[SUCCESS] Connected: ImamWahyudiz (Full Stack &amp; IoT Developer)</text>
    <text x="14" y="54" font-size="10" fill="#94a3b8">[TELEMETRY] Stack initialized • ESP32 firmware • React UI synced</text>
    <text x="14" y="72" font-size="10" fill="#00f2fe" font-weight="700">&gt; Status: ALL SYSTEMS OPERATIONAL _</text>
  </g>
</svg>
