<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer Glow & Gradient Matching Cyber Theme -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f2fe" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Large Circle Ring -->
  <circle cx="32" cy="32" r="26" fill="#040711" stroke="url(#circleGrad)" stroke-width="4.5" filter="url(#neonGlow)"/>

  <!-- Inner Small Accent Circle -->
  <circle cx="32" cy="32" r="11" fill="#00f2fe"/>
</svg>
