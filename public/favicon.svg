<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f2fe" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Background Rounded Hex/Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#030712" stroke="url(#favGrad)" stroke-width="2.5"/>

  <!-- Cyber Terminal Prompt Glyphs & Initials: >_ IW -->
  <g filter="url(#favGlow)">
    <!-- Terminal Prompt Arrow '>' -->
    <path d="M14 20 L24 28 L14 36" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Terminal Underscore '_' -->
    <line x1="15" y1="44" x2="26" y2="44" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bold Cyber Initials 'IW' -->
    <!-- Letter I -->
    <line x1="34" y1="20" x2="34" y2="44" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Letter W -->
    <path d="M41 20 L44.5 44 L48.5 29 L52.5 44 L56 20" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
