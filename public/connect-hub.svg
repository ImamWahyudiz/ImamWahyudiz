<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&amp;family=Orbitron:wght@700;900&amp;display=swap');

      text {
        font-family: 'JetBrains Mono', monospace;
      }
      .font-orbitron {
        font-family: 'Orbitron', 'JetBrains Mono', sans-serif;
      }

      .btn-glow {
        filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.25));
      }
    </style>

    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="156" rx="16" fill="url(#hubBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Title -->
  <g transform="translate(35, 30)">
    <text x="0" y="0" font-size="15" font-weight="800" fill="#00f2fe" class="font-orbitron">06 // TRANSMISSION HUB</text>
    <text x="240" y="0" font-size="12" fill="#94a3b8">Let's connect, build and collaborate on interesting missions.</text>
  </g>

  <!-- 4 Social Cards with Official Vector Logos -->
  <!-- 1. GITHUB -->
  <g transform="translate(35, 55)" class="btn-glow">
    <rect x="0" y="0" width="195" height="75" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <circle cx="35" cy="37" r="18" fill="#1e293b" />
    
    <!-- GitHub Octocat Official Vector -->
    <g transform="translate(24, 26) scale(0.9)" fill="#f8fafc">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
    </g>

    <text x="68" y="32" font-size="12" font-weight="700" fill="#f8fafc">GitHub</text>
    <text x="68" y="50" font-size="10" fill="#00f2fe">@ImamWahyudiz</text>
  </g>

  <!-- 2. LINKEDIN -->
  <g transform="translate(248, 55)" class="btn-glow">
    <rect x="0" y="0" width="195" height="75" rx="10" fill="#0b1329" stroke="#38bdf8" stroke-width="1" />
    <circle cx="35" cy="37" r="18" fill="#0369a1" opacity="0.3" />
    
    <!-- LinkedIn 'in' Official Vector -->
    <g transform="translate(25, 27) scale(0.85)" fill="#38bdf8">
      <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
    </g>

    <text x="68" y="32" font-size="12" font-weight="700" fill="#38bdf8">LinkedIn</text>
    <text x="68" y="50" font-size="10" fill="#94a3b8">Imam Wahyudi</text>
  </g>

  <!-- 3. INSTAGRAM -->
  <g transform="translate(460, 55)" class="btn-glow">
    <rect x="0" y="0" width="195" height="75" rx="10" fill="#0b1329" stroke="#f43f5e" stroke-width="1" />
    <circle cx="35" cy="37" r="18" fill="#be123c" opacity="0.3" />
    
